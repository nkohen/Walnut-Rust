# walnut-rs workspace — a research-driven Rust reimplementation of a subset of
# the Walnut automatic-theorem-prover. See docs/DESIGN.md for the full plan and
# CLAUDE.md for the operating discipline (correctness-first, mechanical port).
[workspace]
resolver = "2"
members = [
    # NB: base-k numeration lives INSIDE wr-core (module `numsys`), not a separate
    # crate — Automaton<->NumberSystem are bidirectionally coupled (kit-finding #1).
    "crates/wr-core",   # WHOLE Automata/ package: FA, Automaton, NumberSystem, Morphism, WordAutomaton, RichAlphabet; determinize/minimize/product/reverse/quotient + language-equivalence oracle
    "crates/wr-logic",  # formula lexer/parser (AST), quantifier elimination, boolean ops
    "crates/wr-io",     # Walnut .txt automaton reader/writer (multi-track + NFA), Graphviz
    "crates/wr-cli",    # Prover/Session command dispatch + REPL (binary)
    "crates/wr-cts",    # thin adapter over RustConstantTermSequences primitives (see DESIGN.md §4)
    "tests/differential", # Rust-vs-real-walnut-java query comparison (Phase 1 spike's exit criterion so far)
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

# Keep the tree lean; add deps deliberately (each Java dep needs a justified Rust
# answer — see DESIGN.md §6 dependency-replacement table).
[workspace.dependencies]
# DESIGN.md §5 Tier 4 (mandatory, Walnut-independent property invariants).
proptest = "1"
# PORTING.md's `java.math.BigInteger` -> `num-bigint` mapping. Added in Phase 2 U7:
# `NumberSystem.getConstant`/`multiplication`/`division` are keyed on `BigInteger`
# constants coming straight out of a user's query, so a fixed width would be a real
# (if unlikely-to-bite) behavioral divergence rather than a provably-safe narrowing.
# `default-features = false` + `std` keeps `rand`/`serde`/`quickcheck` out of the tree.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
