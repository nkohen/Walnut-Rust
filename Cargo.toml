# walnut-rs workspace — a research-driven Rust reimplementation of a subset of
# the Walnut automatic-theorem-prover. See docs/DESIGN.md for the full plan and
# CLAUDE.md for the operating discipline (correctness-first, mechanical port).
[workspace]
resolver = "2"
members = [
    # NB: base-k numeration lives INSIDE wr-core (module `numsys`), not a separate
    # crate — Automaton<->NumberSystem are bidirectionally coupled (kit-finding #1).
    "crates/wr-core",   # WHOLE Automata/ package: FA, Automaton, NumberSystem, Morphism, WordAutomaton, RichAlphabet; determinize/minimize/product/reverse/quotient + language-equivalence oracle
    "crates/wr-logic",  # formula lexer/parser (AST), quantifier elimination, boolean ops
    "crates/wr-io",     # Walnut .txt automaton reader/writer (multi-track + NFA), Graphviz
    "crates/wr-cli",    # Prover/Session command dispatch + REPL (binary)
    "crates/wr-cts",    # thin adapter over RustConstantTermSequences primitives (see DESIGN.md §4)
    "tests/differential", # Tier 3: Rust-vs-real-walnut-java query comparison, generated/captured live
    "tests/golden",       # Tier 1: replay of Walnut's own recorded integration-test corpus (U27)
    "tests/differential-gen", # Tier 3 at scale: generated queries vs a long-lived walnut-java JVM oracle (U29)
    "benches",            # Phase 4 U32: Criterion benchmarks + the head-to-head vs a warm walnut-java JVM
]
# Tier 5 (U30). `fuzz/` is its own workspace with its own NIGHTLY toolchain pin
# (`fuzz/rust-toolchain.toml`) -- `cargo-fuzz` needs `-Z sanitizer` -- so it must stay out
# of this stable-pinned workspace, and out of `cargo test --workspace` / `cargo clippy
# --workspace`. It gets its own fmt/clippy/build gate; see `fuzz/README.md`.
exclude = ["fuzz"]

# U33: build-profile tuning. `benches/STATUS.md`'s U32 baseline was measured on the DEFAULT
# `--release` profile (no LTO, `codegen-units = 16`), which its own "threats to validity"
# section flagged as untested headroom. `lto = "fat"` + `codegen-units = 1` let the optimizer
# inline and specialize ACROSS crate boundaries -- which matters here specifically because the
# hot loops are `wr-core` generics (`product`, `subset_construction`, `Partition::mark`) driven
# from `wr-logic`/`wr-cli`, and the allocator is now a separate C library (mimalloc) that the
# default profile could not inline into either.
#
# This is compiler-flag tuning only: it changes no source, and it cannot change any automaton's
# language. The cost is build time (a from-scratch `--release` build roughly doubles), paid by
# `cargo bench`, `cargo run --release` and `cargo test --release` (the gated-slow tier) --
# NOT by `cargo test --workspace`, which is a `dev`/`test`-profile build and is untouched.
#
# `[profile.bench]` inherits `[profile.release]` (Cargo book, "Profile selection"), so
# `cargo bench` and `cargo test --release` pick these up without a second block.
[profile.release]
lto = "fat"
codegen-units = 1

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-or-later"
rust-version = "1.75"

# Keep the tree lean; add deps deliberately (each Java dep needs a justified Rust
# answer — see DESIGN.md §6 dependency-replacement table).
[workspace.dependencies]
# DESIGN.md §5 Tier 4 (mandatory, Walnut-independent property invariants).
proptest = "1"
# PORTING.md's `java.math.BigInteger` -> `num-bigint` mapping. Added in Phase 2 U7:
# `NumberSystem.getConstant`/`multiplication`/`division` are keyed on `BigInteger`
# constants coming straight out of a user's query, so a fixed width would be a real
# (if unlikely-to-bite) behavioral divergence rather than a provably-safe narrowing.
# `default-features = false` + `std` keeps `rand`/`serde`/`quickcheck` out of the tree.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
# PORTING.md's `java.util.regex.Matcher` -> `regex-automata` mapping. Added in Phase 3 U1
# for `wr-logic`'s lexer: `Main/Predicate.java` tokenizes with 15 `\G`-anchored patterns
# driven by `Matcher.find(index)`, i.e. "match EXACTLY here, never scan forward". The
# `regex` crate has no `\G` anchor and its `find_at` still scans forward, so it cannot
# express that at all; `regex-automata`'s `Input::span(index..).anchored(Anchored::Yes)`
# is the exact equivalent, and its `meta::Regex` keeps `regex`'s own syntax/engines.
# `default-features = false` + this feature set keeps the `dfa`/`hybrid` engines (which
# `meta` never needs for these patterns) out of the tree; `syntax`+`unicode` are required
# because the ported patterns are written in `regex` surface syntax.
regex-automata = { version = "0.4", default-features = false, features = [
    "std",
    "syntax",
    "meta",
    "nfa",
    "perf",
    "unicode",
] }
# U33 (the follow-up to U32's measurement): the global allocator.
#
# `benches/STATUS.md` measured 51.5% of the port's CPU time on a representative workload
# inside the macOS system allocator, on `wr_core::fa::Fa`'s faithfully-ported
# `Vec<BTreeMap<i32, Vec<usize>>>` transition table -- the mechanical-port rule's price, since
# the JVM services that allocate-many-tiny-short-lived-objects pattern with a bump-pointer
# nursery. This is the drop-in counterfactual: it replaces NO algorithm and NO data structure,
# only the `malloc`/`free` implementation underneath them, so it carries no correctness risk
# of the kind `docs/DESIGN.md` §6's dependency-replacement table exists to police (it replaces
# no Java dependency either -- the JVM's allocator has no crates.io analogue to "port").
#
# It is registered per BINARY (`#[global_allocator]` is a program-wide, link-time choice, not a
# library one): `crates/wr-cli/src/main.rs` (the shipped CLI) and `benches/src/lib.rs` (which
# both `compare` and the Criterion bench link). `wr-core`/`wr-logic`/`wr-io` do NOT depend on
# it, so no library in this workspace forces an allocator on its consumers -- `ct-research`
# keeps its own choice.
mimalloc = { version = "0.1", default-features = false }
