[package]
name = "wr-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "wr_cli"
path = "src/lib.rs"

[[bin]]
name = "walnut-rs"
path = "src/main.rs"

[dependencies]
wr-core = { path = "../wr-core" }
wr-logic = { path = "../wr-logic" }
wr-io = { path = "../wr-io" }
wr-cts = { path = "../wr-cts" }
# `Prover.java`'s ~30 `java.util.regex.Pattern` statics — the command-argument grammar. Same
# workspace dependency (and same justifying comment) `wr-logic`'s lexer already uses; see the
# `[workspace.dependencies]` entry. `meta::Regex` keeps `regex`'s own syntax and capture-group
# numbering, which is what lets `Prover.java`'s `static int GROUP_… = 20` constants be ported
# as literal group indices.
regex-automata.workspace = true

# Phase 4 U31: the Tier-4 property-suite unblock. `wr-cli` had no `proptest` dependency at
# all, so no property test was structurally possible in this crate. Same workspace pin
# `wr-core`/`wr-logic`/`wr-cts` already use. Used by `simple_transforms.rs`'s
# `fixleadzero`/`fixtrailzero` closure properties — Tier 4 is about decision-procedure
# math, not dispatch plumbing, so this crate gets property tests only where a genuine
# algorithmic invariant lives at the command level.
[dev-dependencies]
proptest.workspace = true
